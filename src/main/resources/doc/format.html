<p style="font-size: 12px">
    Payload format type. At the moment, the FTL is supported where you need to indicate a relative path to the
    'resources' folder.
    If format is not provided, then the payload is converted to JSON by default, for example:<br>
    <code> <code style="color: #c36229;">format:</code> ftl(path/to/file.ftl) </code><br>
    or<br>
    <code>
        <code style="color: #c36229;">format:</code> template(path/to/file.ftl)
    </code>
</p>
