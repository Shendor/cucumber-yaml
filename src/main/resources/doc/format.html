<p>
   Payload format type. At the moment, the FTL is supported where you need to indicate a relative path to the 'resources' folder.
    If format is not provided, then the payload is converted to JSON by default, for example:<br>
    <code>
format: ftl(path/to/file.ftl)
    </code><br>
    or<br>
    <code>
        format: template(path/to/file.ftl)
    </code>
</p>
