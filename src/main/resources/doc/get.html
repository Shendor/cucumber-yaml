<p style="font-size: 12px">
    Extracts value from local storage, previously saved using function <code>setAndGet</code>, for example:<br>
    <code>
        <code style="color: #c36229;">field1:</code> get(key_a)
    </code><br>
    extracts value by key <i>key_a</i> and throws an Exception if nothing is found.<br>
    <code>
        <code style="color: #c36229;">field2:</code> get(key_a:default value)
    </code><br>
    if no value found for key <i>key_a</i>, then the <i>default value</i> is assigned to <i>field2</i>
</p>
