<h2>Log Test Case property</h2>
<p style="font-size: 12px">
   A regex to be used to search record in the log files.<br>
    To be specific, if your logs are on remote Unix VM, then this regex is used in <i>grep</i> command. For example:<br><br>
    <code>
        <code style="color: #c36229;">lookup:</code> .*some data.*
    </code><br>
</p>
